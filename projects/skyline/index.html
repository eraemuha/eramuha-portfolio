<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1b2a">
  <title>Skyline — Weather at a glance</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef5fb;
      --surface: rgba(255, 255, 255, .82);
      --surface-solid: #fff;
      --text: #102033;
      --muted: #68798d;
      --line: rgba(16, 32, 51, .1);
      --accent: #1687bd;
      --accent-soft: #dff3fb;
      --shadow: 0 24px 70px rgba(18, 69, 102, .15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1724;
        --surface: rgba(20, 36, 53, .86);
        --surface-solid: #142435;
        --text: #edf6ff;
        --muted: #9eafc0;
        --line: rgba(237, 246, 255, .11);
        --accent: #55c2e9;
        --accent-soft: #143c50;
        --shadow: 0 24px 70px rgba(0, 0, 0, .25);
      }
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 20% -10%, rgba(87, 192, 229, .24), transparent 32rem),
        radial-gradient(circle at 100% 40%, rgba(243, 183, 78, .13), transparent 26rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    main { width: min(100% - 32px, 720px); margin: 0 auto; padding: 34px 0 48px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 760; letter-spacing: -.03em; }
    .brand-mark {
      display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px;
      color: #fff; background: linear-gradient(145deg, #ffcc67, #e89443); box-shadow: 0 7px 16px rgba(232, 148, 67, .3);
      font-size: 18px;
    }
    .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 40px); line-height: 1.08; letter-spacing: -.05em; }
    .search { display: flex; gap: 8px; margin-bottom: 20px; }
    input, button { font: inherit; }
    input {
      width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 13px; padding: 13px 15px;
      color: var(--text); background: var(--surface); outline: none; box-shadow: 0 5px 20px rgba(38, 89, 116, .05);
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    button {
      border: 0; border-radius: 13px; padding: 0 18px; color: #fff; background: #143f5b; cursor: pointer; font-weight: 750;
      transition: transform .2s ease, background .2s ease;
    }
    button:hover { transform: translateY(-1px); background: #1d597b; }
    button:disabled { cursor: wait; opacity: .65; transform: none; }
    .hero {
      position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, .55); border-radius: 24px; padding: 25px;
      background: linear-gradient(135deg, rgba(255,255,255,.76), rgba(219,240,249,.52)); box-shadow: var(--shadow);
    }
    @media (prefers-color-scheme: dark) {
      .hero { border-color: rgba(255,255,255,.1); background: linear-gradient(135deg, rgba(33,64,83,.9), rgba(19,40,58,.82)); }
    }
    .hero::after { content: "☼"; position: absolute; top: -30px; right: 20px; color: rgba(255, 199, 92, .52); font-size: 170px; line-height: 1; pointer-events: none; }
    .location { position: relative; z-index: 1; display: flex; align-items: center; gap: 7px; color: var(--muted); font-weight: 650; }
    .location span { color: var(--accent); }
    .current { position: relative; z-index: 1; display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-top: 24px; }
    .temperature { font-size: clamp(65px, 17vw, 112px); font-weight: 260; letter-spacing: -.09em; line-height: .8; }
    .degree { font-size: .42em; vertical-align: top; margin-left: 3px; letter-spacing: -.03em; }
    .condition { max-width: 46%; padding-bottom: 4px; text-align: right; }
    .condition-icon { display: block; margin-bottom: 4px; font-size: 34px; }
    .condition strong { display: block; font-size: 18px; }
    .condition small { color: var(--muted); }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 25px; }
    .metric { padding: 11px 12px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.32); }
    .metric-label { display: block; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .metric-value { display: block; margin-top: 3px; font-weight: 750; }
    section { margin-top: 30px; }
    .section-heading { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    h2 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
    .updated { color: var(--muted); font-size: 12px; }
    .forecast { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
    .day { padding: 16px 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); text-align: center; box-shadow: 0 8px 26px rgba(36, 88, 113, .05); }
    .day-name { color: var(--muted); font-size: 12px; font-weight: 750; }
    .day-icon { display: block; margin: 13px 0 9px; font-size: 25px; }
    .day-temp { font-weight: 780; }
    .day-low { margin-left: 3px; color: var(--muted); font-weight: 500; }
    .status { min-height: 22px; margin: 12px 2px 0; color: var(--muted); font-size: 12px; }
    .status.error { color: #bb603d; }
    footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 500px) {
      main { width: min(100% - 22px, 720px); padding-top: 22px; }
      .hero { padding: 20px; border-radius: 20px; }
      .forecast { gap: 6px; }
      .day { padding: 13px 5px; }
      .day-icon { font-size: 21px; }
      .day-name { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">☀</span><span>skyline</span></div>
      <span class="eyebrow">Live weather</span>
    </header>

    <div class="search">
      <input id="cityInput" type="search" value="Tokyo" placeholder="Search a city…" aria-label="Search for a city">
      <button id="searchButton" type="button">Search</button>
    </div>
    <p id="status" class="status" role="status"></p>

    <article class="hero">
      <div class="location"><span>●</span><span id="location">Tokyo, Japan</span></div>
      <div class="current">
        <div class="temperature"><span id="temperature">22</span><span class="degree">°C</span></div>
        <div class="condition">
          <span id="conditionIcon" class="condition-icon">☀️</span>
          <strong id="condition">Clear skies</strong>
          <small id="feels">Feels like 23°C</small>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><span class="metric-label">Wind</span><span id="wind" class="metric-value">12 km/h</span></div>
        <div class="metric"><span class="metric-label">Humidity</span><span id="humidity" class="metric-value">58%</span></div>
        <div class="metric"><span class="metric-label">Rain</span><span id="rain" class="metric-value">10%</span></div>
      </div>
    </article>

    <section aria-labelledby="forecast-title">
      <div class="section-heading"><h2 id="forecast-title">5-day forecast</h2><span id="updated" class="updated">Tokyo · Today</span></div>
      <div id="forecast" class="forecast"></div>
    </section>
    <footer>Data from Open-Meteo · No API key required</footer>
  </main>

  <script>
    const fallback = {
      city: "Tokyo", country: "Japan", temperature: 22, feels: 23, wind: 12, humidity: 58, rain: 10, code: 0,
      days: [
        ["Today", 22, 16, 0], ["Tue", 24, 17, 1], ["Wed", 20, 15, 3], ["Thu", 18, 13, 61], ["Fri", 21, 14, 2]
      ]
    };
    const weatherMap = {
      0: ["Clear skies", "☀️"], 1: ["Mostly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
      45: ["Misty", "🌫️"], 48: ["Misty", "🌫️"], 51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"],
      55: ["Heavy drizzle", "🌧️"], 61: ["Light rain", "🌦️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
      71: ["Light snow", "🌨️"], 73: ["Snow", "❄️"], 75: ["Heavy snow", "❄️"], 80: ["Showers", "🌦️"],
      81: ["Showers", "🌧️"], 82: ["Heavy showers", "⛈️"], 95: ["Thunderstorm", "⛈️"], 99: ["Thunderstorm", "⛈️"]
    };
    const $ = (id) => document.getElementById(id);
    const dateName = (date, index) => index === 0 ? "Today" : new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(new Date(date + "T12:00:00"));

    function render(data) {
      $("location").textContent = `${data.city}, ${data.country}`;
      $("temperature").textContent = Math.round(data.temperature);
      $("feels").textContent = `Feels like ${Math.round(data.feels)}°C`;
      $("wind").textContent = `${Math.round(data.wind)} km/h`;
      $("humidity").textContent = `${Math.round(data.humidity)}%`;
      $("rain").textContent = `${Math.round(data.rain)}%`;
      const [label, icon] = weatherMap[data.code] || weatherMap[0];
      $("condition").textContent = label;
      $("conditionIcon").textContent = icon;
      $("updated").textContent = `${data.city} · ${new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(new Date())}`;
      $("forecast").innerHTML = data.days.map(day => {
        const [name, high, low, code] = day;
        return `<div class="day"><span class="day-name">${name}</span><span class="day-icon">${(weatherMap[code] || weatherMap[0])[1]}</span><span class="day-temp">${Math.round(high)}°<span class="day-low">${Math.round(low)}°</span></span></div>`;
      }).join("");
    }

    async function loadWeather(city) {
      const button = $("searchButton");
      button.disabled = true;
      $("status").textContent = "Finding forecast…";
      $("status").className = "status";
      try {
        const geoResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
        if (!geoResponse.ok) throw new Error("Location lookup failed");
        const geo = await geoResponse.json();
        if (!geo.results?.length) throw new Error("City not found");
        const place = geo.results[0];
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5`);
        if (!response.ok) throw new Error("Weather request failed");
        const weather = await response.json();
        const current = weather.current;
        render({
          city: place.name, country: place.country || place.country_code, temperature: current.temperature_2m,
          feels: current.apparent_temperature, wind: current.wind_speed_10m, humidity: current.relative_humidity_2m,
          rain: current.precipitation_probability ?? 0, code: current.weather_code,
          days: weather.daily.time.map((date, i) => [dateName(date, i), weather.daily.temperature_2m_max[i], weather.daily.temperature_2m_min[i], weather.daily.weather_code[i]])
        });
        $("status").textContent = "Updated just now";
      } catch (error) {
        render(fallback);
        $("status").textContent = "Live data unavailable · Showing a typical forecast";
        $("status").className = "status error";
      } finally {
        button.disabled = false;
      }
    }

    $("searchButton").addEventListener("click", () => {
      const city = $("cityInput").value.trim();
      if (city) loadWeather(city);
    });
    $("cityInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") $("searchButton").click();
    });
    render(fallback);
    loadWeather("Tokyo");
  </script>
</body>
</html>
